<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <title>Amazon Clone</title>
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav-logo border">
                <div class="logo"></div>
            </div>

            <div class="nav-adress border">
                <p class="nav-deliver">Deliver to</p>
                <div class="nav-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="India">India</p>
                </div>
            </div>
            
            <div class="nav-search-bar border">
            <select class="search-select">
                <option>All</option>
            </select>
            <div class="search-bar">
                <input class="input" type="text" placeholder="Search Amazon">
            </div>
            <div class="search-icon">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            </div>
            <div class="box-4 border">
                <div class="nav-signin">
                <p>Hello, Sign in</p>
                </div>
            <div class="nav-accounts">
                <p>Accounts & Lists</p>
            </div>
            </div>
            
            <div class="box-5 border">
                <p class="Returns">Returns </p>
                <p class="Orders">& Orders</p>
            </div>

            <div class="box-7 border">
               <div class="nav-cart">
                <i class="fa-solid fa-cart-shopping"></i>
                </div>
                <div class="Cart">Cart</div>
            </div>
        </div>
        <div class="panel">
            <div class="panel-all">
            <i class="fa-solid fa-bars"></i>
            All
            </div>
            <div class="panel-options">
            <p>Prime Video</p>
            <p>Coupons</p>
            <p>Customer Service</p>
            <p>Today's Deals</p>
            <p>Registry</p>
            <p>Gift Cards</p>
            <p>Sell</p>
            </div>
        </div>

        </div>

    </header>
    <section class="hero-section">
        <div class="box">
            <div class="box-img" style="background-image: url(box1.jpg);"></div>
            <div class="text">        
               <h2>Shop-Kitchen</h2>
               <h2>Must haves</h2>
            </div>
        </div>
        <div class="box">
           <div class="box-img" style="background-image: url('Shop\ all\ things\ beauty.jpg');"></div>
            <div class="text">        
               <h2>Shop all</h2>
               <h2>thngs beauty</h2>
            </div>
        </div>
        <div class="box">
            <div class="box-img" style="background-image: url('Start\ looking\ sharp.jpg');"></div>
            <div class="text">        
               <h2>Start Looking</h2>
               <h2>Sharp</h2>
            </div>
        </div>

        <div class="box">
            <div class="box-img" style="background-image: url('Toys\ for\ little\ ones.jpg');"></div>
            <div class="text">        
               <h2>Toys for little ones</h2>
            </div>
        </div>

        <div class="box">
            <div class="box-img" style="background-image: url(Level\ up\ your\ PC\ here.jpg);"></div>
            <div class="text">        
               <h2>Level-up your</h2>
               <h2> PC here</h2>
            </div>
        </div>

    </section>
</body>
</html>
